<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist — Daily Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
 
  <main class="card">
    <p class="eyebrow">TASKLIST / <span id="today-date"></span></p>
    <h1>What's on deck today.</h1>
 
    <form id="task-form" class="input-row">
      <input
        type="text"
        id="task-input"
        placeholder="Add a task…"
        autocomplete="off"
        required
      />
      <button type="submit" aria-label="Add task">+</button>
    </form>
 
    <ul id="task-list" class="task-list"></ul>
 
    <p id="empty-state" class="empty-state">Nothing here yet. Add your first task above.</p>
 
    <footer class="footer">
      <span id="task-count">0 of 0 done</span>
      <button id="clear-done" class="text-btn">Clear completed</button>
    </footer>
  </main>
 
  <script src="script.js"></script>
</body>
</html>
